<!-- Questo è una pagina di esempio per la verifica dell'email, generata da Chat per development -->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifica email - SideQuest</title>
  <style>
    body {
      background: #101925;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #192638;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      max-width: 420px;
      width: 85%;
    }
    h1 { color: #f2bd7b; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SideQuest</h1>
    <p id="status">Verifica dell'email in corso...</p>
  </div>

  <script>
    async function verifyEmail() {
      const status = document.getElementById('status');
      const token = new URLSearchParams(
        window.location.search
      ).get('token');

      if (!token) {
        status.textContent = 'Token di verifica mancante.';
        return;
      }

      try {
        const response = await fetch(
          '/api/identity/email/verify',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ token })
          }
        );

        if (!response.ok) {
          throw new Error('Verifica non riuscita');
        }

        status.textContent =
          'Email verificata con successo! ✅';
      } catch (error) {
        status.textContent =
          'Link non valido, scaduto o già utilizzato. ❌';
      }
    }

    verifyEmail();
  </script>
</body>
</html>
