<!DOCTYPE html>
<html lang="$lang$">
<head>

$styles.html()$
</style>

$endfor$
</head>
<body>

  <h1 class="cover-title">$title$</h1>
  <p class="cover-subtitle">$subtitle$</p>

$body$
