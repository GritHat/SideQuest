@startuml uc-04-coinvolgimento
skinparam defaultFontName "Noto Sans"
skinparam defaultFontSize 12
skinparam shadowing false
skinparam actorStyle awesome
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontSize 10
skinparam ArrowFontColor #475569
skinparam usecase {
  BackgroundColor #F8EEDC
  BorderColor #8A5A12
  FontColor #1B2438
}
skinparam actor {
  BorderColor #1B2438
  BackgroundColor #FFFFFF
}
skinparam rectangle {
  BorderColor #94A3B8
  FontColor #334155
  FontStyle bold
}
skinparam note {
  BackgroundColor #FEF3C7
  BorderColor #B45309
  FontSize 10
}
left to right direction
title R06 e pacchetto D (R16-R18) · Area personale, notifiche, classifiche, badge e statistiche

actor "Visitatore" as Vis
actor "Utente registrato" as Reg
Reg -|> Vis

rectangle "SideQuest" {
  usecase "UC-06.1\nConsultare l'area personale" as UC061
  usecase "UC-06.2\nRicevere notifiche\nin tempo reale" as UC062
  usecase "UC-06.3\nConsultare lo storico\ndelle notifiche" as UC063

  usecase "UC-16.1\nConsultare la classifica" as UC161
  usecase "UC-16.2\nIndividuare la propria\nposizione" as UC162

  usecase "UC-17.1\nConsultare badge\ne traguardi" as UC171
  usecase "UC-17.2\nOttenere un badge" as UC172

  usecase "UC-18.1\nConsultare le statistiche\npersonali" as UC181

  usecase "UC-05.5\nDeterminare l'esito\ne assegnare i punti" as UC055
}

Reg - -> UC061
Reg - -> UC062
Reg - -> UC063
Vis - -> UC161
UC162 .> UC161 : <<extend>>
Reg - -> UC162
Reg - -> UC171
UC172 .> UC055 : <<extend>>\n(missione completata)
Reg - -> UC181
@enduml

