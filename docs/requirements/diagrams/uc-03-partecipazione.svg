@startuml uc-03-partecipazione
skinparam defaultFontName "Noto Sans"
skinparam defaultFontSize 12
skinparam shadowing false
skinparam actorStyle awesome
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontSize 10
skinparam ArrowFontColor #475569
skinparam usecase {
  BackgroundColor #F8EEDC
  BorderColor #8A5A12
  FontColor #1B2438
}
skinparam actor {
  BorderColor #1B2438
  BackgroundColor #FFFFFF
}
skinparam rectangle {
  BorderColor #94A3B8
  FontColor #334155
  FontStyle bold
}
skinparam note {
  BackgroundColor #FEF3C7
  BorderColor #B45309
  FontSize 10
}
left to right direction
title R04-R05 · Accettazione, progressi, prove e completamento

actor "Esploratore" as Esp
actor "Autore" as Aut
actor "Tempo" as Tempo <<sistema>>

rectangle "SideQuest" {
  usecase "UC-04\nAccettare una missione" as UC04
  usecase "UC-04.1\nAccettare una missione\nsegreta a tempo" as UC041
  usecase "UC-04.2\nConsultare la missione\nin corso" as UC042
  usecase "UC-04.3\nRilevare la scadenza" as UC043

  usecase "UC-05.1\nSegnare un obiettivo\ncome completato" as UC051
  usecase "UC-05.2\nAllegare una prova" as UC052
  usecase "UC-05.3\nVerificare le prove" as UC053
  usecase "UC-05.4\nAbbandonare una missione" as UC054
  usecase "UC-05.5\nDeterminare l'esito\ne assegnare i punti" as UC055
}

UC041 -|> UC04
Esp - -> UC04
Esp - -> UC042
Esp - -> UC051
Esp - -> UC054
UC052 .> UC051 : <<extend>>
Aut - -> UC053
UC053 ..> UC055 : <<include>>
Tempo - -> UC043
UC043 ..> UC055 : <<include>>

@enduml

