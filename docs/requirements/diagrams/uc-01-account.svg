@startuml uc-01-account
skinparam defaultFontName "Noto Sans"
skinparam defaultFontSize 12
skinparam shadowing false
skinparam actorStyle awesome
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontSize 10
skinparam ArrowFontColor #475569
skinparam usecase {
  BackgroundColor #F8EEDC
  BorderColor #8A5A12
  FontColor #1B2438
}
skinparam actor {
  BorderColor #1B2438
  BackgroundColor #FFFFFF
}
skinparam rectangle {
  BorderColor #94A3B8
  FontColor #334155
  FontStyle bold
}
skinparam note {
  BackgroundColor #FEF3C7
  BorderColor #B45309
  FontSize 10
}
left to right direction
title R01 · Account, accesso, profilo e amministrazione

actor "Visitatore" as Vis
actor "Utente registrato" as Reg
actor "Amministratore" as Adm
actor "Servizio email" as Mail <<sistema esterno>>
Reg -|> Vis
Adm -|> Reg

rectangle "SideQuest" {
  usecase "UC-01.1\nRegistrarsi" as UC011
  usecase "UC-01.2\nVerificare l'indirizzo email" as UC012
  usecase "UC-01.3\nAccedere" as UC013
  usecase "UC-01.4\nUscire" as UC014
  usecase "UC-01.5\nGestire il proprio profilo" as UC015
  usecase "UC-01.6\nEliminare il proprio account" as UC016
  usecase "UC-01.7\nGestire gli utenti" as UC017
  usecase "UC-01.8\nInvalidare una missione" as UC018
}

Vis - -> UC011
Vis - -> UC013
Vis - -> UC012
Reg - -> UC014
Reg - -> UC015
Reg - -> UC016
Adm - -> UC017
Adm - -> UC018
UC011 ..> UC012 : <<include>>
UC012 - -> Mail
@enduml

