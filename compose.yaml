services:
  postgres:
    image: postgres:16-alpine
    container_name: sidequest-identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
      POSTGRES_DB: sidequest_identity
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

volumes:
  identity_postgres_data: